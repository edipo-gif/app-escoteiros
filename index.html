<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Escoteiros - Sentinelas do Vale</title>

    <!-- Instalação como aplicativo (Android e iPhone) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#003366">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sentinelas">

    <!-- Biblioteca de PDF salva junto do app, para funcionar também sem internet -->
    <script src="pdf-lib.min.js"></script>
    <style>
        :root {
            --azul-escoteiro: #003366; 
            --amarelo-escoteiro: #FFCC00; 
            --fundo: #F4F7F6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fundo);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; }
        }
        .cabecalho {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-eb {
            height: 40px;
            max-width: 100%;
        }
        .grupo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            text-align: left;
        }
        .emblema {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
        }
        .grupo-nome {
            font-size: 17px;
            font-weight: bold;
            color: var(--azul-escoteiro);
            line-height: 1.25;
        }
        .grupo-local {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
        }
        h2 {
            color: var(--azul-escoteiro);
            text-align: center;
            border-bottom: 2px solid var(--amarelo-escoteiro);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
            width: 100%;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: var(--azul-escoteiro);
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            padding: 10px;
            padding-right: 35px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-clear-field {
            position: absolute;
            right: 5px;
            background: none;
            border: none;
            color: #999;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
        }
        .btn-clear-field:hover {
            color: #e74c3c;
        }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; min-width: 0; }
        .row .form-group.uf { flex: 0 0 70px; }
        .botoes { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-gerar { background-color: var(--azul-escoteiro); color: white; }
        .btn-gerar:hover { background-color: #002244; }
        .btn-limpar { background-color: #e74c3c; color: white; }
        .btn-limpar:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <div class="cabecalho">
        <img class="logo-eb" src="img/logo-escoteiros-do-brasil.png" alt="Escoteiros do Brasil">
        <div class="grupo">
            <img class="emblema" src="img/emblema-sentinelas.png" alt="Emblema do Grupo Escoteiro Sentinelas do Vale">
            <div>
                <div class="grupo-nome">Grupo Escoteiro<br>Sentinelas do Vale</div>
                <div class="grupo-local">Cachoeirinha - RS · 323/RS</div>
            </div>
        </div>
    </div>

    <h2>Autorização de Atividade</h2>
    
    <div class="form-group">
        <label>Nome da Atividade Externa (Max 150 caracteres)</label>
        <div class="input-wrapper">
            <input type="text" id="atividade" maxlength="150" placeholder="Ex: Acampamento de Inverno">
            <button class="btn-clear-field" onclick="limparUmCampo('atividade')">X</button>
        </div>
    </div>

    <div class="form-group">
        <label>CEP (Opcional)</label>
        <div class="input-wrapper">
            <input type="text" id="cep" placeholder="00000-000" onblur="buscarCEP()">
            <button class="btn-clear-field" onclick="limparUmCampo('cep')">X</button>
        </div>
    </div>

    <div class="form-group">
        <label>Logradouro</label>
        <div class="input-wrapper">
            <input type="text" id="logradouro" placeholder="Rua/Avenida (Busca automática pelo CEP)">
            <button class="btn-clear-field" onclick="limparUmCampo('logradouro')">X</button>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Número</label>
            <div class="input-wrapper">
                <input type="text" id="numero">
                <button class="btn-clear-field" onclick="limparUmCampo('numero')">X</button>
            </div>
        </div>
        <div class="form-group">
            <label>Complemento</label>
            <div class="input-wrapper">
                <input type="text" id="complemento">
                <button class="btn-clear-field" onclick="limparUmCampo('complemento')">X</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Bairro</label>
            <div class="input-wrapper">
                <input type="text" id="bairro">
                <button class="btn-clear-field" onclick="limparUmCampo('bairro')">X</button>
            </div>
        </div>
        <div class="form-group">
            <label>Cidade</label>
            <div class="input-wrapper">
                <input type="text" id="cidade">
                <button class="btn-clear-field" onclick="limparUmCampo('cidade')">X</button>
            </div>
        </div>
        <div class="form-group uf">
            <label>UF</label>
            <div class="input-wrapper">
                <input type="text" id="uf" maxlength="2">
                <button class="btn-clear-field" onclick="limparUmCampo('uf')">X</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>Referência/Localização</label>
        <div class="input-wrapper">
            <input type="text" id="referencia" placeholder="Ex: Próximo à praça">
            <button class="btn-clear-field" onclick="limparUmCampo('referencia')">X</button>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Data Início</label>
            <div class="input-wrapper">
                <input type="date" id="data_inicio">
                <button class="btn-clear-field" onclick="limparUmCampo('data_inicio')">X</button>
            </div>
        </div>
        <div class="form-group">
            <label>Data Fim</label>
            <div class="input-wrapper">
                <input type="date" id="data_fim">
                <button class="btn-clear-field" onclick="limparUmCampo('data_fim')">X</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Hora Saída</label>
            <div class="input-wrapper">
                <input type="time" id="hora_saida">
                <button class="btn-clear-field" onclick="limparUmCampo('hora_saida')">X</button>
            </div>
        </div>
        <div class="form-group">
            <label>Hora Chegada</label>
            <div class="input-wrapper">
                <input type="time" id="hora_chegada">
                <button class="btn-clear-field" onclick="limparUmCampo('hora_chegada')">X</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>Custo Individual (R$)</label>
        <div class="input-wrapper">
            <input type="text" id="custo" placeholder="28,57">
            <button class="btn-clear-field" onclick="limparUmCampo('custo')">X</button>
        </div>
    </div>

    <div class="botoes">
        <button class="btn-limpar" onclick="limparTodosCampos()">Limpar Tudo</button>
        <button class="btn-gerar" onclick="gerarPDF()">Gerar e Compartilhar PDF</button>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    function limparUmCampo(idDoCampo) {
        document.getElementById(idDoCampo).value = '';
    }

    function limparTodosCampos() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => input.value = '');
    }

    async function buscarCEP() {
        let cep = document.getElementById('cep').value.replace(/\D/g, '');
        if (cep.length === 8) {
            try {
                let response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                let data = await response.json();
                if (!data.erro) {
                    document.getElementById('logradouro').value = data.logradouro;
                    document.getElementById('bairro').value = data.bairro;
                    document.getElementById('cidade').value = data.localidade;
                    document.getElementById('uf').value = data.uf;
                }
            } catch (error) {
                console.log("Erro ao buscar CEP");
            }
        }
    }

    function formatarData(dataISO) {
        if(!dataISO) return '';
        const partes = dataISO.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    // Coordenadas medidas diretamente nas linhas do modelo 'autorizacao_atividade.pdf'
    // (página A4 = 595 x 842 pontos, origem no canto inferior esquerdo).
    // y = linha do formulário + 2, para o texto ficar "sentado" logo acima do traço.
    // xFim = onde o traço termina; textos maiores diminuem a fonte para caber.
    const CAMPOS_PDF = {
        atividade:   { x: 26,  y: 708, xFim: 570, tamanho: 10 }, // linha abaixo de "membro do Movimento..."
        local:       { x: 88,  y: 697, xFim: 570, tamanho: 9 },  // "localizada em:"
        dataInicio:  { x: 420, y: 675, xFim: 485, tamanho: 9 },  // "a realizar-se entre os dias ____"
        dataFim:     { x: 503, y: 675, xFim: 559, tamanho: 9 },  // "e ____"
        saida:       { x: 60,  y: 664, xFim: 570, tamanho: 9 },  // "Saída:"
        chegada:     { x: 78,  y: 653, xFim: 570, tamanho: 9 },  // "Chegada:"
        custo:       { x: 141, y: 641, xFim: 300, tamanho: 9 }   // ao lado de "Custo individual da atividade:"
    };

    function escreverNoCampo(pagina, fonte, texto, campo) {
        if (!texto) return;
        const larguraMax = campo.xFim - campo.x;
        let tamanho = campo.tamanho;
        // Reduz a fonte até caber na linha (mínimo 6pt, ainda legível)
        while (tamanho > 6 && fonte.widthOfTextAtSize(texto, tamanho) > larguraMax) {
            tamanho -= 0.5;
        }
        // Se ainda assim não couber, corta o final com reticências
        if (fonte.widthOfTextAtSize(texto, tamanho) > larguraMax) {
            while (texto.length > 1 && fonte.widthOfTextAtSize(texto + '…', tamanho) > larguraMax) {
                texto = texto.slice(0, -1);
            }
            texto = texto.trimEnd() + '…';
        }
        pagina.drawText(texto, { x: campo.x, y: campo.y, size: tamanho, font: fonte, color: PDFLib.rgb(0, 0, 0) });
    }

    function preencherPagina(pagina, fonte, dados) {
        escreverNoCampo(pagina, fonte, dados.atividade, CAMPOS_PDF.atividade);
        escreverNoCampo(pagina, fonte, dados.local_linha_unica, CAMPOS_PDF.local);
        escreverNoCampo(pagina, fonte, dados.dataIn, CAMPOS_PDF.dataInicio);
        escreverNoCampo(pagina, fonte, dados.dataFim, CAMPOS_PDF.dataFim);
        escreverNoCampo(pagina, fonte, dados.saidaTexto, CAMPOS_PDF.saida);
        escreverNoCampo(pagina, fonte, dados.chegadaTexto, CAMPOS_PDF.chegada);
        escreverNoCampo(pagina, fonte, dados.custoTexto, CAMPOS_PDF.custo);
    }

    async function gerarPDF() {
        const atividade = document.getElementById('atividade').value;
        const cidade = document.getElementById('cidade').value || '';
        const uf = document.getElementById('uf').value || '';
        const logradouro = document.getElementById('logradouro').value || '';
        const numero = document.getElementById('numero').value || '';
        const bairro = document.getElementById('bairro').value || '';
        const referencia = document.getElementById('referencia').value || '';
        
        let local_linha_unica = '';
        if(cidade && uf) {
            local_linha_unica = `${cidade}/${uf}, ${logradouro}, ${numero} - ${bairro} (${referencia}) - ${cidade.toUpperCase()}/${uf.toUpperCase()}`;
        }
        
        const dataIn = formatarData(document.getElementById('data_inicio').value);
        const dataFim = formatarData(document.getElementById('data_fim').value);
        
        const hSaida = document.getElementById('hora_saida').value;
        const hChegada = document.getElementById('hora_chegada').value;
        const saidaTexto = (dataIn && hSaida) ? `${dataIn} ${hSaida} - Sede do Grupo` : '';
        const chegadaTexto = (dataFim && hChegada) ? `${dataFim} ${hChegada} - Sede do grupo` : '';
        
        const custoValor = document.getElementById('custo').value;
        const custoTexto = custoValor ? `R$ ${custoValor}` : '';

        try {
            const urlModelo = 'autorizacao_atividade.pdf'; 
            const modeloBytes = await fetch(urlModelo).then(res => res.arrayBuffer());
            const pdfDoc = await PDFLib.PDFDocument.load(modeloBytes);
            const fonte = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
            preencherPagina(pdfDoc.getPages()[0], fonte, {
                atividade, local_linha_unica, dataIn, dataFim, saidaTexto, chegadaTexto, custoTexto
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const arquivo = new File([blob], "Autorizacao_Preenchida.pdf", { type: "application/pdf" });

            if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                await navigator.share({
                    title: 'Autorização Escoteira',
                    text: 'Segue a autorização gerada pelo nosso novo app!',
                    files: [arquivo]
                });
            } else {
                const urlBlob = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = urlBlob;
                a.download = "Autorizacao_Preenchida.pdf";
                a.click();
            }

        } catch (erro) {
            alert("Erro ao gerar o PDF. Verifique se o ficheiro 'autorizacao_atividade.pdf' está na mesma pasta.");
            console.error(erro);
        }
    }
</script>

</body>
</html>
